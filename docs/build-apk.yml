name: Build Robot2027 App V1.3 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Thiết lập Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Cài đặt Capacitor Dependencies
        run: |
          npm install

      - name: 5. Khởi tạo dự án Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Tích hợp Native Kiosk, Zero-Beep Mic & Dual TTS (V1.3)
        run: |
          python3 scripts/setup_android.py

      - name: 7. Biên dịch APK Debug V1.3 (Kèm Google Maven Mirror)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 8. Xuất file APK hoàn chỉnh
        uses: actions/upload-artifact@v4
        with:
          name: Robot2027-v1.3-complete-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
